# Weekly grouped dependency updates (#161). Majors for the framework stack
# are deliberate holds (React 19 / Next 16 / Tailwind 4), and so is ESLint 10
# until its plugins declare it (#599); they stay ignored. Everything else
# lands as one grouped PR that must pass CI.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: react
        update-types: ["version-update:semver-major"]
      - dependency-name: react-dom
        update-types: ["version-update:semver-major"]
      - dependency-name: next
        update-types: ["version-update:semver-major"]
      - dependency-name: tailwindcss
        update-types: ["version-update:semver-major"]
      # ESLint 10 waits for eslint-plugin-import, -jsx-a11y and -react to
      # declare it (#599; see eslint.config.mjs).
      - dependency-name: eslint
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
